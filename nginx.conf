server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Configuração editável (montada como volume), nunca em cache
    location /config/ {
        add_header Cache-Control "no-store";
    }

    # API do Glances (rede do host, só escuta em 127.0.0.1)
    location /api/ {
        proxy_pass http://127.0.0.1:61208/api/;
        proxy_set_header Host $host;
    }

    # API local dos Shelly: /shelly/<ip>/<caminho>. Só IPs privados e só os caminhos da API.
    location ~ "^/shelly/(?<shelly_ip>10(\.\d{1,3}){3}|192\.168(\.\d{1,3}){2}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2})/(?<shelly_path>(rpc|status|relay)(/.*)?)$" {
        proxy_pass http://$shelly_ip/$shelly_path$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
