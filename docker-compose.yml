services:
  custom-homepage:
    build: .
    container_name: homelab
    restart: unless-stopped
    # Rede do host: o nginx chega ao Glances em 127.0.0.1 e aos Shelly na LAN.
    # A página fica em http://<servidor> (porta 80, definida no nginx.conf).
    network_mode: host
    volumes:
      - ./config:/usr/share/nginx/html/config:ro
    depends_on:
      glances:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  glances:
    image: nicolargo/glances:4.5.8
    container_name: glances
    restart: unless-stopped
    pid: host
    uts: host
    network_mode: host
    environment:
      # Só escuta em 127.0.0.1: a API não fica exposta à LAN, só via nginx.
      - GLANCES_OPT=-w --disable-webui -B 127.0.0.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - /:/rootfs:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:61208/api/4/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
